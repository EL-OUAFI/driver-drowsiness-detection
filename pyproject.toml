[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-drowsiness-detection"
version = "0.1.0"
description = "Real-time driver drowsiness detection with an optical-flow baseline and a HOG-SVM pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "All rights reserved unless stated otherwise." }
authors = []
dependencies = [
    "dlib>=19.24",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
drowsiness = "driver_drowsiness.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
